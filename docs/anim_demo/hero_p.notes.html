<b>Anh hùng · Kiếm gió lốc</b> (tầm 1)<br>
Lùi người vung kiếm đồng → chém chéo, phóng lưỡi gió trắng sang địch (trúng nhẹ).<br>
Lưỡi gió hoá lốc xoáy tại chỗ: nhấc địch lên, 3 nhịp cắt nhỏ, tướng giơ kiếm rồi bổ xuống → địch rơi = đòn chính (HIT chung).<br>
Sát thương mẫu: 5 + 3×5 + 40 = 60 (atk 55–65).
