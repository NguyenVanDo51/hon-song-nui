<p><b>Pháp Sư Gọi Hồn · Gọi hồn</b> (cận chiến, tầm 1, sát thương yếu)</p>
<p>Niệm chú ngắn: giơ gậy đầu lâu lửa xanh lên, tay kia xoè, vòng phù xanh hiện dưới chân, đốm hồn bốc lên.</p>
<p>Chỉ gậy về phía địch → 3 đốm hồn xanh bung ra, xoáy vào mục tiêu: 2 đòn nhỏ (6) + đòn cuối (30) dùng hiệu ứng trúng đòn chung.</p>
