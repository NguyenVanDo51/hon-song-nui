<b>Bộ binh · Đâm thương xuyên giáp</b>
<ul>
<li>Bước lên nửa bước, thu thương ra sau lấy đà (mũi thương lóe sáng).</li>
<li>Lao người đâm thẳng: thương phóng ra, luồng sáng trắng-vàng xuyên qua thân địch, vòng khí bật ra phía sau.</li>
<li>Đòn trúng dùng hiệu ứng va chạm chung (dừng hình, rung, tia lửa, số sát thương).</li>
</ul>
