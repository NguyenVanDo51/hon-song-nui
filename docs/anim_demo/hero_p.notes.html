<b>Hiệp Sĩ Chỉ Huy · Kiếm Giáng</b>
<ul>
<li>Đứng yên: hai tay đặt trên chuôi đại kiếm cắm đất, áo choàng xòe viền vàng, mũ vương miện + đôi cánh.</li>
<li>Nhổ kiếm khỏi đất → vung ra sau đầu → chém chéo xuống địch = đòn chính (HIT chung, 1 lần).</li>
<li>Chém xong cắm kiếm lại xuống đất (bụi + rung nhẹ).</li>
</ul>
