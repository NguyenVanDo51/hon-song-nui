<b>Sói Bóng Đêm · Vồ cắn</b>
<ul>
<li>Thu mình lấy đà → vồ bay qua ô → đớp mạnh: 3 vết cào đỏ trên địch.</li>
<li>Vết cắn làm địch <b>suy yếu</b> (−10 công / −10 thủ): khói đỏ sẫm xoáy + mũi tên xuống.</li>
<li>Nhảy lùi về ô cũ. Đuôi, tai, hàm dưới là lò xo/khớp riêng; khói tím bám theo chân.</li>
</ul>
